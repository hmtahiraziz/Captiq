apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

/**
 * Set true to minify release Java bytecode with R8.
 * Keep RN ProGuard rules in place when enabling.
 */
def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def captiqStoreFile = System.getenv("CAPTIQ_UPLOAD_STORE_FILE")
def captiqStorePassword = System.getenv("CAPTIQ_UPLOAD_STORE_PASSWORD")
def captiqKeyAlias = System.getenv("CAPTIQ_UPLOAD_KEY_ALIAS")
def captiqKeyPassword = System.getenv("CAPTIQ_UPLOAD_KEY_PASSWORD")
def hasReleaseKeystore =
    captiqStoreFile != null &&
    !captiqStoreFile.isEmpty() &&
    file(captiqStoreFile).exists() &&
    captiqStorePassword != null &&
    captiqKeyAlias != null &&
    captiqKeyPassword != null

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mobile"
    defaultConfig {
        applicationId "ai.captiq.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(captiqStoreFile)
                storePassword captiqStorePassword
                keyAlias captiqKeyAlias
                keyPassword captiqKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Local unsigned/dev-only fallback — Play upload requires CAPTIQ_UPLOAD_* env.
                signingConfig signingConfigs.debug
                logger.warn("CAPTIQ_UPLOAD_* keystore env not set; release is signed with debug keystore")
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
